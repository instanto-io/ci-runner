name: probe

# Temporary: reports what the existing host runners can do, so the image build
# can move off GitHub-hosted runners.
on: workflow_dispatch

jobs:
  probe:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    steps:
      - name: Report host capabilities
        run: |
          echo "runner: ${RUNNER_NAME} (${RUNNER_OS} ${RUNNER_ARCH})"
          for tool in docker podman buildah git curl; do
            printf '  %-10s %s\n' "$tool" "$(command -v "$tool" || echo missing)"
          done
          docker version --format '  docker: {{.Server.Version}} ({{.Server.Os}}/{{.Server.Arch}})' 2>&1 | tail -1
          docker buildx version 2>&1 | sed 's/^/  buildx: /' | tail -1
          echo "  disk free: $(df -h / | awk 'NR==2 {print $4}')"
          echo "registry reachability:"
          for url in https://artifacts.instanto.io/v2/ http://artifacts.instanto.io/v2/ http://artifacts.instanto.io:5000/v2/; do
            printf '  %-46s %s\n' "$url" "$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 "$url" || echo unreachable)"
          done

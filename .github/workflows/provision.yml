name: Provision container runner

on:
  workflow_dispatch:
    inputs:
      host:
        description: Image-builder host that will run the container
        required: true
        type: choice
        options:
          - plato
          - diogenes

permissions:
  contents: read

concurrency:
  group: provision-container-${{ inputs.host }}
  cancel-in-progress: false

jobs:
  provision:
    runs-on: [self-hosted, Linux, X64, image-builder, "${{ inputs.host }}"]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Check target host
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME}" = "${{ inputs.host }}"
          docker --version
          if docker info >/dev/null 2>&1; then
            echo "DOCKER_USE_SUDO=0" >> "${GITHUB_ENV}"
          elif sudo -n docker info >/dev/null 2>&1; then
            echo "DOCKER_USE_SUDO=1" >> "${GITHUB_ENV}"
          else
            id
            getent group docker || true
            echo "The runner account cannot access Docker directly or through passwordless sudo." >&2
            exit 1
          fi

      - name: Install runner configuration
        shell: bash
        env:
          RUNNER_REGISTRATION_TOKEN: ${{ secrets.RUNNER_REGISTRATION_TOKEN }}
          TARGET_HOST: ${{ inputs.host }}
        run: |
          set -euo pipefail
          : "${RUNNER_REGISTRATION_TOKEN:?RUNNER_REGISTRATION_TOKEN is required}"
          docker_cmd() {
            if [ "${DOCKER_USE_SUDO}" = 1 ]; then sudo -n docker "$@"; else docker "$@"; fi
          }

          deploy="${HOME}/.local/share/instanto-ci-runner"
          install -d -m 700 "${deploy}"
          install -m 644 .dockerignore Dockerfile compose.persistent.yaml "${deploy}/"
          install -m 755 entrypoint.sh verify-toolchain.sh "${deploy}/"
          printf '%s' "${RUNNER_REGISTRATION_TOKEN}" > "${deploy}/runner-registration.token"
          chmod 600 "${deploy}/runner-registration.token"
          printf 'RUNNER_HOST=%s\n' "${TARGET_HOST}" > "${deploy}/.env"

          cd "${deploy}"
          docker_cmd compose -f compose.persistent.yaml build runner-1
          docker_cmd compose -f compose.persistent.yaml run --rm runner-1 verify
          docker_cmd compose -f compose.persistent.yaml up -d --force-recreate runner-1
          container=$(docker_cmd compose -f compose.persistent.yaml ps -q runner-1)
          for attempt in {1..30}; do
            docker_cmd exec "${container}" test -s /runner-state/.runner && break
            sleep 2
          done
          docker_cmd exec "${container}" test -s /runner-state/.runner

      - name: Remove short-lived registration token
        if: always()
        shell: bash
        run: |
          token="${HOME}/.local/share/instanto-ci-runner/runner-registration.token"
          if [ -f "${token}" ]; then
            : > "${token}"
            chmod 600 "${token}"
          fi

      - name: Report runner container
        shell: bash
        run: |
          set -euo pipefail
          docker_cmd() {
            if [ "${DOCKER_USE_SUDO}" = 1 ]; then sudo -n docker "$@"; else docker "$@"; fi
          }
          deploy="${HOME}/.local/share/instanto-ci-runner"
          cd "${deploy}"
          docker_cmd compose -f compose.persistent.yaml ps runner-1
          container=$(docker_cmd compose -f compose.persistent.yaml ps -q runner-1)
          test -n "${container}"
          docker_cmd inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "${container}" |
            grep '^PLAYWRIGHT_'

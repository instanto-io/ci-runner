name: image

# Publishes the runner image to the registry in the CI_RUNNER_REGISTRY repository
# variable: packages.instanto.io, Forgejo's container registry over HTTPS through
# the LAN proxy, so no host needs a plain-HTTP registry configured. Each architecture is built natively on a host runner labelled
# image-builder: an arm64 host publishes arm64, an x86-64 host publishes amd64.
# The container runners get Docker only from their own Docker-in-Docker sidecar,
# never the host's daemon, so images are published from the host runners.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - verify-toolchain.sh
      - clean-docker.sh
      - clean-job.sh
      - publish.sh
      - .github/workflows/image.yml
  workflow_dispatch:

jobs:
  publish:
    name: Publish (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            labels: [self-hosted, image-builder, ARM64]
          - arch: amd64
            labels: [self-hosted, image-builder, X64]
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 90
    env:
      CI_RUNNER_REGISTRY: ${{ vars.CI_RUNNER_REGISTRY }}
    steps:
      - uses: actions/checkout@v7
      # A host may keep the instanto-docker token in a file the runner can read;
      # otherwise the organisation's package token and user are used. The entry is
      # written directly rather than through docker login, because the CLI defaults
      # to the macOS keychain, which a background service cannot reach.
      - name: Sign in to the registry
        env:
          TOKEN: ${{ secrets.FORGEJO_PACKAGE_TOKEN }}
          TOKEN_USER: ${{ secrets.FORGEJO_PACKAGE_USER }}
        run: |
          set -euo pipefail
          if [ -f "$HOME/.forgejo-ci-runner.pat" ]; then
            user=instanto-docker
            secret=$(tr -d '\r\n' < "$HOME/.forgejo-ci-runner.pat")
          else
            user="${TOKEN_USER}"
            secret="${TOKEN}"
          fi
          if [ -z "$secret" ] || [ -z "$user" ]; then
            echo "No registry credential: set FORGEJO_PACKAGE_TOKEN and FORGEJO_PACKAGE_USER, or place one in ~/.forgejo-ci-runner.pat" >&2
            exit 1
          fi
          echo "Signing in to ${CI_RUNNER_REGISTRY} as ${user}"
          export DOCKER_CONFIG="$RUNNER_TEMP/docker"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          mkdir -p "$DOCKER_CONFIG"
          auth=$(printf '%s:%s' "$user" "$secret" | base64 | tr -d '\n')
          printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_RUNNER_REGISTRY" "$auth" > "$DOCKER_CONFIG/config.json"
          chmod 600 "$DOCKER_CONFIG/config.json"
          # CLI plugins are found under the config directory, so buildx has to be
          # reachable from this one too.
          if [ -d "$HOME/.docker/cli-plugins" ]; then
            ln -sfn "$HOME/.docker/cli-plugins" "$DOCKER_CONFIG/cli-plugins"
          fi
          docker manifest inspect --insecure "$CI_RUNNER_REGISTRY/instanto-docker/ci-runner:arm64" >/dev/null 2>&1 \
            && echo "registry reachable and credentials accepted" || echo "no image published yet; credentials written"

      - name: Build, verify and publish
        run: ./publish.sh

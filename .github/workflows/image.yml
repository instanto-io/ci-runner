name: image

# Publishes the runner image to the registry in the CI_RUNNER_REGISTRY repository
# variable. Each architecture is built natively on a host runner labelled
# image-builder: an arm64 host publishes arm64, an x86-64 host publishes amd64.
# The container runners have no Docker by design.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - verify-toolchain.sh
      - publish.sh
      - .github/workflows/image.yml
  workflow_dispatch:

jobs:
  publish:
    name: Publish (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            labels: [self-hosted, image-builder, ARM64]
          - arch: amd64
            labels: [self-hosted, image-builder, X64]
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 90
    env:
      CI_RUNNER_REGISTRY: ${{ vars.CI_RUNNER_REGISTRY }}
    steps:
      - uses: actions/checkout@v7
      # Organisation secrets reach public repositories only on the Free plan, so the
      # token is empty here; the host keeps one in a file the runner can read. The
      # entry is written directly rather than through docker login, because the CLI
      # defaults to the macOS keychain, which a background service cannot reach.
      - name: Sign in to the registry
        env:
          TOKEN: ${{ secrets.FORGEJO_PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          secret="${TOKEN}"
          if [ -z "$secret" ] && [ -f "$HOME/.forgejo-ci-runner.pat" ]; then
            secret=$(tr -d '\r\n' < "$HOME/.forgejo-ci-runner.pat")
          fi
          if [ -z "$secret" ]; then
            echo "No registry credential: set FORGEJO_PACKAGES_TOKEN or place one in ~/.forgejo-ci-runner.pat" >&2
            exit 1
          fi
          export DOCKER_CONFIG="$RUNNER_TEMP/docker"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          mkdir -p "$DOCKER_CONFIG"
          auth=$(printf '%s:%s' instanto-docker "$secret" | base64 | tr -d '\n')
          printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_RUNNER_REGISTRY" "$auth" > "$DOCKER_CONFIG/config.json"
          chmod 600 "$DOCKER_CONFIG/config.json"
          # CLI plugins are found under the config directory, so buildx has to be
          # reachable from this one too.
          if [ -d "$HOME/.docker/cli-plugins" ]; then
            ln -sfn "$HOME/.docker/cli-plugins" "$DOCKER_CONFIG/cli-plugins"
          fi
          docker manifest inspect --insecure "$CI_RUNNER_REGISTRY/instanto-docker/ci-runner:arm64" >/dev/null 2>&1 \
            && echo "registry reachable and credentials accepted" || echo "no image published yet; credentials written"

      - name: Build, verify and publish
        run: ./publish.sh
